# SonarQube configuration for the NIE Template.
#
# Sonar complements the gates in .github/workflows/: it computes cyclomatic and
# cognitive complexity from source (no coverage-format dependency), tracks
# duplication, and trends coverage over time. Pair it with the CRAP hotspots in
# quality-deep.yml — Sonar tells you what is complex, CRAP tells you what is
# complex AND untested.
#
# A workstation-wide SonarQube is available at http://127.0.0.1:9000 via
# ~/Dev/global-dev-infra. Register this application with
# scripts/New-AppResources.ps1 to get its own project key, then replace
# sonar.projectKey below with the generated value.
#
# IMPORTANT: C# analysis requires the MSBuild scanner (begin/end), not the plain
# CLI scanner. TypeScript/Vue analysis works with either.
#
#   dotnet tool install --global dotnet-sonarscanner --version 11.2.1
#   dotnet sonarscanner begin /k:"nie-template" /d:sonar.host.url="http://127.0.0.1:9000" \
#     /d:sonar.token="$env:SONAR_TOKEN" \
#     /d:sonar.coverageReportPaths="artifacts/coverage-report/SonarQube.xml"
#   dotnet build src/backend/Backend.sln -c Release
#   dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"

sonar.projectKey=nie-template
sonar.projectName=NIE Template
sonar.projectVersion=2026.08.07.7

sonar.sources=src/backend,src/frontend/apps,src/frontend/packages
sonar.tests=src/backend/Tests,tests/specs

sonar.sourceEncoding=UTF-8

# Test file patterns, so Sonar does not report issues in tests as production debt.
sonar.test.inclusions=**/*Tests/**/*.cs,**/__tests__/**/*.ts,**/*.spec.ts,**/*.test.ts

# Generated and vendored code carries no maintainability signal.
sonar.exclusions=\
  **/bin/**,\
  **/obj/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  src/backend/Tests/**,\
  **/Migrations/**,\
  **/Protos/**,\
  **/*.g.cs,\
  **/*.designer.cs,\
  temp/**

sonar.coverage.exclusions=\
  **/Migrations/**,\
  **/Protos/**,\
  **/*.config.*,\
  **/app-config/**,\
  src/frontend/**/types/**

# ReportGenerator converts the backend Cobertura inputs into Sonar's generic
# coverage schema. Do not pass Cobertura to the Visual Studio coverage parser.
sonar.coverageReportPaths=artifacts/coverage-report/SonarQube.xml
sonar.javascript.lcov.reportPaths=\
  src/frontend/apps/main/coverage/lcov.info,\
  src/frontend/packages/ui/coverage/lcov.info,\
  src/frontend/packages/platform/coverage/lcov.info

sonar.typescript.tsconfigPaths=src/frontend/**/tsconfig.json
