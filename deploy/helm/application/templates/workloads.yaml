{{- range $name, $workload := .Values.workloads }}
{{- $serviceName := include "application.serviceName" (list $ $name) }}
{{- $isBlueGreen := and $.Values.rollouts.enabled (eq $workload.strategy "BlueGreen") }}
{{- if $isBlueGreen }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}-active
  labels:
    app.kubernetes.io/name: {{ include "application.name" $ }}
    app.kubernetes.io/component: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "application.name" $ }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $workload.servicePort }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}-preview
  labels:
    app.kubernetes.io/name: {{ include "application.name" $ }}
    app.kubernetes.io/component: {{ $name }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "application.name" $ }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $workload.servicePort }}
      targetPort: http
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ $serviceName }}
spec:
  replicas: {{ $workload.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "application.name" $ }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "application.name" $ }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- with $workload.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      nodeSelector:
        pool: {{ default "apps-arm" $workload.nodePool }}
      {{- if gt (int (default 1 $workload.replicas)) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "application.name" $ }}
                    app.kubernetes.io/component: {{ $name }}
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "application.name" $ }}
                    app.kubernetes.io/component: {{ $name }}
                topologyKey: topology.kubernetes.io/zone
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $workload.image.repository }}:{{ $workload.image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $workload.image.pullPolicy }}
          ports:
            - containerPort: {{ $workload.containerPort }}
              name: http
          envFrom:
            - secretRef:
                name: {{ $.Values.runtimeSecretName }}
          readinessProbe:
            httpGet:
              path: {{ $workload.healthPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $workload.healthPath }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
  strategy:
    blueGreen:
      activeService: {{ $serviceName }}-active
      previewService: {{ $serviceName }}-preview
      autoPromotionEnabled: true
---
{{- else }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $serviceName }}
spec:
  replicas: {{ $workload.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "application.name" $ }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "application.name" $ }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- with $workload.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      nodeSelector:
        pool: {{ default "apps-arm" $workload.nodePool }}
      {{- if gt (int (default 1 $workload.replicas)) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "application.name" $ }}
                    app.kubernetes.io/component: {{ $name }}
                topologyKey: kubernetes.io/hostname
            - weight: 50
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "application.name" $ }}
                    app.kubernetes.io/component: {{ $name }}
                topologyKey: topology.kubernetes.io/zone
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $workload.image.repository }}:{{ $workload.image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $workload.image.pullPolicy }}
          ports:
            - containerPort: {{ $workload.containerPort }}
              name: http
          envFrom:
            - secretRef:
                name: {{ $.Values.runtimeSecretName }}
          readinessProbe:
            httpGet:
              path: {{ $workload.healthPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $workload.healthPath }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "application.name" $ }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - name: http
      port: {{ $workload.servicePort }}
      targetPort: http
---
{{- end }}
{{- end }}
