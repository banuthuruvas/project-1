name: application

services:
  application-ui:
    image: ${DOCKER_REGISTRY_URL:-local}/application-ui:${COMMIT_ID:-latest}
    container_name: application-ui
    restart: always
    build:
      context: ..
      dockerfile: build/Dockerfile.ui
    ports:
      - "8102:80"
    networks:
      - application-network
    depends_on:
      - application-auth-service
      - application-api-service

  application-auth-service:
    image: ${DOCKER_REGISTRY_URL:-local}/application-auth-api:${COMMIT_ID:-latest}
    container_name: application-auth-service
    restart: always
    build:
      context: ..
      dockerfile: build/Dockerfile.auth
    volumes:
      - ./appsettings.auth.json:/app/appsettings.json:ro
    networks:
      - application-network
    environment:
      - ASPNETCORE_ENVIRONMENT=production
      - HTTPS_PROXY=${PROXY_VALUE:-}
      - HTTP_PROXY=${PROXY_VALUE:-}
      - NO_PROXY=${NO_PROXY_VALUE:-}
      - https_proxy=${PROXY_VALUE:-}
      - http_proxy=${PROXY_VALUE:-}
      - no_proxy=${NO_PROXY_VALUE:-}
    depends_on:
      - application-valkey

  application-api-service:
    image: ${DOCKER_REGISTRY_URL:-local}/application-main-api:${COMMIT_ID:-latest}
    container_name: application-api-service
    restart: always
    build:
      context: ..
      dockerfile: build/Dockerfile.api
    volumes:
      - ./appsettings.api.json:/app/appsettings.json:ro
      - ./uploads:/app/files
    environment:
      - ASPNETCORE_ENVIRONMENT=production
      - HTTPS_PROXY=${PROXY_VALUE:-}
      - HTTP_PROXY=${PROXY_VALUE:-}
      - NO_PROXY=${NO_PROXY_VALUE:-}
      - https_proxy=${PROXY_VALUE:-}
      - http_proxy=${PROXY_VALUE:-}
      - no_proxy=${NO_PROXY_VALUE:-}
    networks:
      - application-network
    depends_on:
      - application-postgres
      - application-valkey

  application-valkey:
    image: dhi.io/valkey:9.0.3-debian13
    container_name: application-valkey
    restart: always
    networks:
      - application-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  application-postgres:
    image: dhi.io/postgres:18.3-alpine3.22
    container_name: application-postgres
    restart: always
    environment:
      POSTGRES_DB: "Application"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - application-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Application"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  application-network:
    driver: bridge
