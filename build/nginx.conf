map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream auth_backend {
    server application-auth-service:8080;
}

upstream api_backend {
    server application-api-service:8080;
}

server {
    listen 80;
    server_name localhost;

    proxy_cookie_path / /;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.onesignal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.onesignal.com https://*.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Custom maintenance page when upstream services are unavailable.
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /usr/share/nginx/html;
        internal;
        add_header Cache-Control "no-store" always;
    }

    # Auth API proxy - replace MYAPP with your app's base path
    location /MYAPP/api-auth/ {
        proxy_pass http://auth_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_cookie_path / /MYAPP/;
    }

    # TickerQ dashboard and notification hub require WebSocket-friendly proxy settings.
    location /MYAPP/api-main/tickerq/ {
        proxy_pass http://api_backend/tickerq/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        proxy_buffering off;

        proxy_cookie_path / /MYAPP/;
    }

    # Main API proxy - replace MYAPP with your app's base path
    location /MYAPP/api-main/ {
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_cookie_path / /MYAPP/;
    }

    # Login (auth) frontend - replace MYAPP with your app's base path
    location /MYAPP/login/ {
        alias /usr/share/nginx/html/login/;
        try_files $uri $uri/ /MYAPP/login/index.html;

        location ~* \.(js)$ {
            add_header Content-Type application/javascript;
        }

        location ~* \.(css)$ {
            add_header Content-Type text/css;
        }

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
    }

    # Main frontend - replace MYAPP with your app's base path
    location /MYAPP/ {
        alias /usr/share/nginx/html/main/;
        try_files $uri $uri/ /usr/share/nginx/html/main/index.html;

        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    location / {
        root /usr/share/nginx/html/main;
        try_files $uri $uri/ /index.html;
    }
}
